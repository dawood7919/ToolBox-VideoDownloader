name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          TB_VERSION_CODE: ${{ github.run_number }}

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          TB_VERSION_CODE: ${{ github.run_number }}

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/toolbox-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/toolbox-${{ github.run_number }}-release.apk"
          ls -lh dist

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-release-apk
          path: dist/*-release.apk
          if-no-files-found: error

      - name: Publish APKs as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "ToolBox build ${{ github.run_number }}" \
            --notes "Automated build of commit ${{ github.sha }}"
